<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" />
  <title>Offline · MarketBrains</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: #f2f2f7; color: #111114; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } p { color: #a1a1aa !important; } }
    .mark { width: 72px; height: 72px; border-radius: 24px; margin: 0 auto 16px; display: grid; place-items: center;
      background: linear-gradient(145deg, #7b6cff, #4a3de0); color: #fff; font-size: 36px; font-weight: 800; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 20px; color: #5c5c66; }
    button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #5b4bf5; color: #fff; font: inherit; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1>You're offline</h1>
    <p>Reconnect to catch up with the conversation.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
